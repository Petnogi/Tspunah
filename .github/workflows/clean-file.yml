name: Clean and Wrap Address List

on:
  push:
    branches:
      - main  # Замените на master, если ваша ветка называется так
    paths:
      - 'source.list'  # Робот следит только за этим файлом

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process file
        run: |
          # 1. Удаляем строки-комментарии (начинаются с #)
          # 2. Удаляем пустые строки
          # 3. Удаляем строки из одной латинской буквы (оглавление)
          # 4. Оборачиваем оставшиеся строки в start/ и /finish
          sed -e '/^#/d' -e '/^$/d' -e '/^[A-Za-z]$/d' -e 's/^/start\//' -e 's/$/\/finish/' source.list > addresses.list

      - name: Commit and Push cleaned file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add addresses.list
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-clean and wrap address list" && git push)
